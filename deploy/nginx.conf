server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Qt WASM preloads venus-gui-v2.wasm; build leaves venus-gui-v2.wasm.gz only.
    location = /venus-gui-v2.wasm {
        gzip_static on;
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
